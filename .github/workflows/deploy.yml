name: CI/CD Pipeline - KaamSaathi

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: 'Confirm: build images and deploy to production VPS'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: inquiryexperts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.x

      - name: Install project dependencies
        run: |
          npm ci --prefix mobile/backend
          npm ci --prefix mobile/frontend
          npm ci --prefix website/backend
          npm ci --prefix website/frontend
          npm ci --prefix website/admin-frontend

      - name: Run quality gate
        shell: pwsh
        run: ./scripts/quality-check.ps1

  production-approval:
    name: Production Approval
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'workflow_dispatch' && inputs.confirm_production_deploy == true)
    needs: quality
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Confirmed production release
        run: echo "Production release approved for ${{ github.sha }}"

  build-and-push:
    name: Build & Push Docker Images
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'workflow_dispatch' && inputs.confirm_production_deploy == true)
    needs: production-approval
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Mobile Backend
        uses: docker/build-push-action@v7
        with:
          context: ./mobile/backend
          file: ./mobile/backend/Dockerfile
          push: true
          tags: |
            demonicorpse23/kaamsaathi-mobile-backend:${{ github.sha }}
            demonicorpse23/kaamsaathi-mobile-backend:latest

      - name: Build and Push Website Backend
        uses: docker/build-push-action@v7
        with:
          context: ./website/backend
          file: ./website/backend/Dockerfile
          push: true
          tags: |
            demonicorpse23/kaamsaathi-website-backend:${{ github.sha }}
            demonicorpse23/kaamsaathi-website-backend:latest

      - name: Build and Push Website Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./website/frontend
          file: ./website/frontend/Dockerfile
          build-args: |
            VITE_API_BASE_URL=https://web_api.inquiry.business
          push: true
          tags: |
            demonicorpse23/kaamsaathi-website-frontend:${{ github.sha }}
            demonicorpse23/kaamsaathi-website-frontend:latest

      - name: Build and Push Admin Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./website/admin-frontend
          file: ./website/admin-frontend/Dockerfile
          build-args: |
            VITE_API_BASE_URL=https://web_api.inquiry.business
          push: true
          tags: |
            demonicorpse23/kaamsaathi-admin-frontend:${{ github.sha }}
            demonicorpse23/kaamsaathi-admin-frontend:latest

  deploy-to-vps:
    name: Deploy to VPS
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'workflow_dispatch' && inputs.confirm_production_deploy == true)
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      # Keeps the VPS stack definition in sync with the repo, so adding a service
      # or an environment variable here is all it takes to ship it.
      - name: Copy Compose Files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          source: "docker-compose.yml,nginx/nginx.conf"
          target: /var/www/kaamsaathi
          overwrite: true

      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        env:
          GOOGLE_MAPS_SERVER_API_KEY: ${{ secrets.GOOGLE_MAPS_SERVER_API_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          envs: GOOGLE_MAPS_SERVER_API_KEY,GOOGLE_WEB_CLIENT_ID,FACEBOOK_APP_ID,FACEBOOK_APP_SECRET
          script: |
            mkdir -p /var/www/kaamsaathi
            cd /var/www/kaamsaathi
            # Refresh just these keys so any other vars already in .env survive.
            touch .env
            grep -vE '^(GOOGLE_MAPS_SERVER_API_KEY|GOOGLE_WEB_CLIENT_ID|FACEBOOK_APP_ID|FACEBOOK_APP_SECRET)=' .env > .env.tmp || true
            {
              echo "GOOGLE_MAPS_SERVER_API_KEY=$GOOGLE_MAPS_SERVER_API_KEY"
              echo "GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID"
              echo "FACEBOOK_APP_ID=$FACEBOOK_APP_ID"
              echo "FACEBOOK_APP_SECRET=$FACEBOOK_APP_SECRET"
            } >> .env.tmp
            mv .env.tmp .env
            chmod 600 .env
            docker compose pull
            docker compose up -d --remove-orphans
            # nginx (gateway) resolves upstream container names to an IP once at startup
            # and caches it for its whole lifetime. Since its own image never changes,
            # `up -d` above never recreates it — so after mobile-backend/website-backend
            # get new containers (new IPs) above, gateway would keep proxying to the old,
            # dead IPs until something restarts it. Do that here on every deploy.
            docker compose restart gateway
            docker image prune -f
            docker exec giftme-caddy-1 caddy reload --config /etc/caddy/Caddyfile || true
