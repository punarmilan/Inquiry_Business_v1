name: CI/CD Pipeline - KaamSaathi

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: 'Confirm: build images and deploy to production VPS'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: inquiryexperts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.x

      - name: Install project dependencies
        run: |
          npm ci --prefix mobile/backend
          npm ci --prefix mobile/frontend
          npm ci --prefix website/backend
          npm ci --prefix website/frontend
          npm ci --prefix website/admin-frontend

      - name: Run quality gate
        shell: pwsh
        run: ./scripts/quality-check.ps1

  production-approval:
    name: Production Approval
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'workflow_dispatch' && inputs.confirm_production_deploy == true)
    needs: quality
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Confirmed production release
        run: echo "Production release approved for ${{ github.sha }}"

  build-and-push:
    name: Build & Push Docker Images
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'workflow_dispatch' && inputs.confirm_production_deploy == true)
    needs: production-approval
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Mobile Backend
        uses: docker/build-push-action@v7
        with:
          context: ./mobile/backend
          file: ./mobile/backend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/kaamsaathi-mobile-backend:${{ github.sha }}
            ${{ env.DOCKERHUB_NAMESPACE }}/kaamsaathi-mobile-backend:latest

      - name: Build and Push Website Backend
        uses: docker/build-push-action@v7
        with:
          context: ./website/backend
          file: ./website/backend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/kaamsaathi-website-backend:${{ github.sha }}
            ${{ env.DOCKERHUB_NAMESPACE }}/kaamsaathi-website-backend:latest

      - name: Build and Push Website Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./website/frontend
          file: ./website/frontend/Dockerfile
          build-args: |
            VITE_API_BASE_URL=https://web-api.inquiry.business
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/kaamsaathi-website-frontend:${{ github.sha }}
            ${{ env.DOCKERHUB_NAMESPACE }}/kaamsaathi-website-frontend:latest

      - name: Build and Push Admin Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./website/admin-frontend
          file: ./website/admin-frontend/Dockerfile
          build-args: |
            VITE_API_BASE_URL=https://web-api.inquiry.business
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/kaamsaathi-admin-frontend:${{ github.sha }}
            ${{ env.DOCKERHUB_NAMESPACE }}/kaamsaathi-admin-frontend:latest

      - name: Verify all release images exist
        shell: bash
        run: |
          set -euo pipefail
          for image in \
            kaamsaathi-mobile-backend \
            kaamsaathi-website-backend \
            kaamsaathi-website-frontend \
            kaamsaathi-admin-frontend; do
            docker buildx imagetools inspect "${DOCKERHUB_NAMESPACE}/${image}:${GITHUB_SHA}" >/dev/null
          done

  deploy-to-vps:
    name: Deploy to VPS
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'workflow_dispatch' && inputs.confirm_production_deploy == true)
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      VPS_APP_DIR: ${{ secrets.VPS_APP_DIR || '/var/www/Inquiry_Business_v1' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      # Keeps the VPS stack definition in sync with the repo, so adding a service
      # or an environment variable here is all it takes to ship it.
      - name: Copy Compose Files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          source: "docker-compose.yml,nginx/nginx.conf,scripts/configure-vps-nginx.sh"
          target: ${{ env.VPS_APP_DIR }}
          overwrite: true

      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
          APP_DIR: ${{ env.VPS_APP_DIR }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MOBILE_JWT_ACCESS_SECRET: ${{ secrets.MOBILE_JWT_ACCESS_SECRET }}
          MOBILE_JWT_REFRESH_SECRET: ${{ secrets.MOBILE_JWT_REFRESH_SECRET }}
          WEB_JWT_ACCESS_SECRET: ${{ secrets.WEB_JWT_ACCESS_SECRET }}
          WEB_JWT_REFRESH_SECRET: ${{ secrets.WEB_JWT_REFRESH_SECRET }}
          GOOGLE_MAPS_SERVER_API_KEY: ${{ secrets.GOOGLE_MAPS_SERVER_API_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          envs: DOCKERHUB_NAMESPACE,DOCKERHUB_TOKEN,IMAGE_TAG,APP_DIR,MONGO_URI,MOBILE_JWT_ACCESS_SECRET,MOBILE_JWT_REFRESH_SECRET,WEB_JWT_ACCESS_SECRET,WEB_JWT_REFRESH_SECRET,GOOGLE_MAPS_SERVER_API_KEY,GOOGLE_WEB_CLIENT_ID,FACEBOOK_APP_ID,FACEBOOK_APP_SECRET
          script: |
            set -eu
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"
            if [ -n "${DOCKERHUB_TOKEN:-}" ]; then
              printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_NAMESPACE" --password-stdin
            fi
            # Refresh deployment keys while preserving unrelated VPS settings.
            touch .env
            env_keys='DOCKERHUB_NAMESPACE|IMAGE_TAG'
            for key in MONGO_URI MOBILE_JWT_ACCESS_SECRET MOBILE_JWT_REFRESH_SECRET WEB_JWT_ACCESS_SECRET WEB_JWT_REFRESH_SECRET GOOGLE_MAPS_SERVER_API_KEY GOOGLE_WEB_CLIENT_ID FACEBOOK_APP_ID FACEBOOK_APP_SECRET; do
              if [ -n "${!key:-}" ]; then
                env_keys="$env_keys|$key"
              fi
            done
            grep -vE "^(${env_keys})=" .env > .env.tmp || true
            {
              echo "DOCKERHUB_NAMESPACE=$DOCKERHUB_NAMESPACE"
              echo "IMAGE_TAG=$IMAGE_TAG"
              [ -z "${MONGO_URI:-}" ] || echo "MONGO_URI=$MONGO_URI"
              [ -z "${MOBILE_JWT_ACCESS_SECRET:-}" ] || echo "MOBILE_JWT_ACCESS_SECRET=$MOBILE_JWT_ACCESS_SECRET"
              [ -z "${MOBILE_JWT_REFRESH_SECRET:-}" ] || echo "MOBILE_JWT_REFRESH_SECRET=$MOBILE_JWT_REFRESH_SECRET"
              [ -z "${WEB_JWT_ACCESS_SECRET:-}" ] || echo "WEB_JWT_ACCESS_SECRET=$WEB_JWT_ACCESS_SECRET"
              [ -z "${WEB_JWT_REFRESH_SECRET:-}" ] || echo "WEB_JWT_REFRESH_SECRET=$WEB_JWT_REFRESH_SECRET"
              [ -z "${GOOGLE_MAPS_SERVER_API_KEY:-}" ] || echo "GOOGLE_MAPS_SERVER_API_KEY=$GOOGLE_MAPS_SERVER_API_KEY"
              [ -z "${GOOGLE_WEB_CLIENT_ID:-}" ] || echo "GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID"
              [ -z "${FACEBOOK_APP_ID:-}" ] || echo "FACEBOOK_APP_ID=$FACEBOOK_APP_ID"
              [ -z "${FACEBOOK_APP_SECRET:-}" ] || echo "FACEBOOK_APP_SECRET=$FACEBOOK_APP_SECRET"
            } >> .env.tmp
            mv .env.tmp .env
            chmod 600 .env
            for key in MONGO_URI MOBILE_JWT_ACCESS_SECRET MOBILE_JWT_REFRESH_SECRET WEB_JWT_ACCESS_SECRET WEB_JWT_REFRESH_SECRET; do
              if ! grep -qE "^${key}=.+" .env; then
                echo "Missing required deployment secret: ${key}" >&2
                exit 1
              fi
            done
            docker compose --env-file .env config --quiet
            docker compose --env-file .env pull
            # Deploy the exact commit that was built and recreate all services
            # so a cached `latest` container cannot leave stale UI code live.
            docker compose --env-file .env up -d --force-recreate --remove-orphans
            bash "$APP_DIR/scripts/configure-vps-nginx.sh"
            # nginx (gateway) resolves upstream container names to an IP once at startup
            # and caches it for its whole lifetime. Since its own image never changes,
            # `up -d` above never recreates it — so after mobile-backend/website-backend
            # get new containers (new IPs) above, gateway would keep proxying to the old,
            # dead IPs until something restarts it. Do that here on every deploy.
            # Containers can take a few seconds to start after recreation. Retry
            # the complete gateway check so readiness timing is not a false failure.
            ready=0
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error --max-time 10 -H 'Host: inquiry.business' http://127.0.0.1:8088/ | grep -q 'InquiryExperts' \
                && curl --fail --silent --show-error --max-time 10 -H 'Host: admin.inquiry.business' http://127.0.0.1:8088/login | grep -q 'InquiryExperts Admin' \
                && curl --fail --silent --show-error --max-time 10 -H 'Host: web-api.inquiry.business' http://127.0.0.1:8088/health >/dev/null \
                && curl --fail --silent --show-error --max-time 10 -H 'Host: app-api.inquiry.business' http://127.0.0.1:8088/health >/dev/null; then
                ready=1
                break
              fi
              echo "Waiting for gateway services (attempt $attempt/12)..."
              sleep 5
            done
            test "$ready" -eq 1
            docker image prune -f
